# ~/.apo/config.yaml do usuário apo na VM (copiado pelo install.sh só se não existir).
socketPath: ~/.apo/apo.sock
limits:
  # 4 vCPUs: worktrees rodam install/build/test; 2 workers em paralelo com folga.
  maxGlobalWorkers: 2
  maxWorkersPerProvider: 2
  stallTimeoutMinutes: 10
remote:
  # IP do Tailscale da VM (ubuntu-lab). Token em ~/.apo/secrets.env (APO_REMOTE_TOKEN).
  listen: "${TAILSCALE_IP}:7400"
jev:
  enabled: true
memory:
  enabled: true
# Antigravity (agy) é opt-in: instale com WITH_AGY=1 no install.sh, faça o login
# como apo e descomente. Listar targets substitui o padrão: mantenha claude e codex.
# providers:
#   targets:
#     - { id: claude-code, harness: claude-code, provider: anthropic }
#     - { id: codex, harness: codex, provider: openai }
#     - { id: antigravity, harness: antigravity, provider: google, model: gemini-3.8-flash-medium, dangerouslySkipPermissions: true }
